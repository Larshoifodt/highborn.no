<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lucida — tenkestedet (UX-mock)</title>
<style>
/* ══════════════════════════════════════════════════════════════════════════
   LYSARK — DESIGNTOKENS  v0.2  (2026-09-04; v0.2 = Sigill-papiret inn i lys modus)
   ──────────────────────────────────────────────────────────────────────────
   Bottega-system for LATERNA (verkstedets egen drakt — decks velger sitt
   eget system i deck.json). AVLEDET av Sigills uttrykk, ikke en kopi:
   arven er prinsippene (varmt papir, flater med tone og luft i stedet for
   rammer, tokens navngitt etter rolle, mørk modus som likeverdig halvdel).
   Identiteten er Laternas egen: laterna magica — lys gjennom film mot
   lerret. Derfor: LYKT-gul aksent (ikke Sigills seglrød), SKYGGE-blå som
   andrestemme (skyggespillet), serif-fortellerstemme i display (Sigill er
   humanist sans), og mørk modus som «mørkerommet», ikke «stempelputen».

   Merkevareskille (ufravikelig): seglrød #9C4434, stempelgrønn #2C3630 og
   Caveat-ordmerket tilhører Sigill og brukes ALDRI her.
   ══════════════════════════════════════════════════════════════════════════ */

:root {
  /* ── FARGE — rollenavn, ikke fargenavn (arv fra Sigill) ───────────────
     Lys modus er «papiret»: Sigills papirflater stjålet med Lars' velsignelse
     (2026-09-04: «perfekt å jobbe i — bare uten logoen»). Bunn/ark/hinne/
     dempet er Sigill-verdier; blekket og aksentene forblir Laternas egne. */
  --f-bunn:    #F3EDE1;   /* papiret (Sigill-arv, uendret)              */
  --f-ark:     #FBF8F1;   /* felt og kort — lysere enn bunnen (Sigill)  */
  --f-blekk:   #2B2620;   /* tekst — varm sepiasort (Sigill er grønnsort) */
  --f-dempet:  #6F675C;   /* sekundærtekst (Sigill-verdi, 4,9:1)        */
  --f-hinne:   #DFD7C7;   /* hårstreker og skiller (Sigill)             */

  /* Aksent: LYKTA — lyskilden. Fokus, valgt slide, det som lyser nå.
     Brukes som Sigill bruker seglet: aldri pynt, bare peking. */
  --f-lykt:      #8A5710;   /* et hakk dypere etter papir-byttet: 5,0:1 på bunn */
  --f-lykt-mild: #F0E0BF; /* lyktfarge som flate, ikke strek            */

  /* Andrestemme: SKYGGEN — skyggespillet på lerretet. Lenker, sekundær
     markering, kilde-referanser. Kjølig mot lyktas varme.               */
  --f-skygge:      #3D566B;
  --f-skygge-mild: #DDE5EC;

  /* ── ROM — ikke lineær (arvet uendret fra Sigill: skalaen er god) ─────*/
  --r-1: 4px;   --r-2: 8px;   --r-3: 16px;  --r-4: 24px;
  --r-5: 40px;  --r-6: 64px;  --r-7: 96px;  --r-8: 160px;

  /* ── RADIUS (arvet) ───────────────────────────────────────────────────*/
  --rad-liten: 8px;
  --rad-stor:  14px;
  --rad-flate: 22px;
  --rad-pille: 999px;

  /* ── FLATER — tone og luft, aldri rammer (arv) ────────────────────────*/
  --flate-bunn:   var(--f-ark);
  --flate-ramme:  transparent;
  --flate-skygge: none;

  /* ── SKRIFT — fortellerstemmen er forskjellen ─────────────────────────
     Display = fortelleren. Serif: laterna magica er historiefortelling,
                boka ved lampen — ikke skjemaet. (Sigill: humanist sans.)
     Tekst   = alt i mengde. Nøytral bærer (samme som Sigill).
     Data    = tall og koder i kolonne (samme). */
  --sk-display: Cambria, Georgia, "Times New Roman", serif;
  --sk-tekst:   -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --sk-data:    "SF Mono", "Cascadia Mono", Consolas, "Liberation Mono", monospace;

  --sk-nano:   10px;
  --sk-mikro:  11px;
  --sk-liten:  13px;
  --sk-brod:   15px;
  --sk-stor:   19px;
  --sk-tittel: 26px;
  --sk-scene:  clamp(22px, 3.4vw, 34px);   /* store overskrifter i verkstedet */

  --sp-label: .18em;   /* mono-etiketter i versaler må sperres (arv)    */

  /* ── SKYGGE — lav og varm: lyset kommer fra lykta, ikke taket ─────────*/
  --sg-lav:  0 1px 2px rgba(43, 38, 32, .08);
  --sg-loft: 0 2px 4px rgba(43, 38, 32, .09), 0 8px 24px rgba(43, 38, 32, .08);

  /* Gløden — det aktive elementet (valgt slide i railen, aktiv container).
     Lysark-spesifikk: en svak lysring i stedet for tykkere ramme.        */
  --lys-glod: 0 0 0 2px var(--f-lykt-mild), 0 2px 12px rgba(143, 91, 20, .18);

  /* ── BEVEGELSE (arvet: tre hastigheter, aldri en fjerde) ──────────────*/
  --bv-rask: 140ms cubic-bezier(.4, 0, .2, 1);
  --bv-myk:  380ms cubic-bezier(.22, 1, .36, 1);
  --bv-treg: 700ms cubic-bezier(.22, 1, .36, 1);

  /* ── MÅL — verkstedets flater (fra Laternas systemdesign §1) ──────────*/
  --rail-b:  168px;    /* slide-rail, venstre                            */
  --kilde-b: 248px;    /* kilder-panelet                                 */
  --notat-h: 128px;    /* notatfeltet, bunn                              */
}

/* ══════════════════════════════════════════════════════════════════════════
   MØRK MODUS — «mørkerommet»
   ──────────────────────────────────────────────────────────────────────────
   Rommet bak framviseren: varmt brunsort, aldri bekmørkt (arven fra
   Sigills resonnement — ren sort gir harde kanter og glødende tynn tekst).
   Lykta MÅ lysnes for kontrast; samme rolle, annen verdi — derfor
   rollenavn på tokens.
   ══════════════════════════════════════════════════════════════════════════ */

/* JS-FRI VEKSLING: radioer med faste id-er (#fs-papir/-lerret/-morkerom/
   -blaatime) styrer fargespill via :has() — virker også i sandkasser som
   blokkerer script (f.eks. filforhåndsvisninger). data-attributtene er
   fortsatt API-et for apper med JS; radioene er spesimen-veien. */
@media (prefers-color-scheme: dark) {
  :root:not([data-tema="lys"]):not(:has(#fs-papir:checked, #fs-lerret:checked)) {
    --f-bunn:        #262019;
    --f-ark:         #2F2820;
    --f-blekk:       #F0E8D6;
    --f-dempet:      #A2957F;
    --f-hinne:       #453C30;
    --f-lykt:        #E3A54F;
    --f-lykt-mild:   #4A3A22;
    --f-skygge:      #8FB0C9;
    --f-skygge-mild: #33404C;
    --sg-lav:  0 1px 2px rgba(0, 0, 0, .24);
    --sg-loft: 0 2px 4px rgba(0, 0, 0, .28), 0 8px 24px rgba(0, 0, 0, .24);
    --lys-glod: 0 0 0 2px var(--f-lykt-mild), 0 2px 12px rgba(227, 165, 79, .22);
  }
}

/* Brukerens eget valg slår alltid systemets (arv fra Sigill). */
:root[data-tema="mork"],
:root:has(#fs-morkerom:checked),
:root:has(#fs-blaatime:checked) {
  --f-bunn:        #262019;
  --f-ark:         #2F2820;
  --f-blekk:       #F0E8D6;
  --f-dempet:      #A2957F;
  --f-hinne:       #453C30;
  --f-lykt:        #E3A54F;
  --f-lykt-mild:   #4A3A22;
  --f-skygge:      #8FB0C9;
  --f-skygge-mild: #33404C;
  --sg-lav:  0 1px 2px rgba(0, 0, 0, .24);
  --sg-loft: 0 2px 4px rgba(0, 0, 0, .28), 0 8px 24px rgba(0, 0, 0, .24);
  --lys-glod: 0 0 0 2px var(--f-lykt-mild), 0 2px 12px rgba(227, 165, 79, .22);
}

/* Flate-variant «helt borte» (arv): tre tokens, null komponentendringer. */
:root[data-flater="borte"] {
  --flate-bunn:   transparent;
  --flate-ramme:  transparent;
  --flate-skygge: none;
}

/* ══════════════════════════════════════════════════════════════════════════
   FARGESPILL — hele designet byttes med ett attributt (Lars, 2026-09-04)
   ──────────────────────────────────────────────────────────────────────────
   `data-fargespill` på rot-elementet velger et komplett fargeforslag.
   Papir (lys) og Mørkerom (mørk) er GRUNNPARET og trenger ikke attributt.
   Blokkene under er FORSLAG til vurdering — settes de i produksjon, rykker
   de opp i dokumentasjonen; forkastes de, slettes de herfra.
   NB: står ETTER tema-blokkene med vilje — samme spesifisitet, siste vinner.
   Bruk sammen med data-tema (lerret → tema="lys", blåtime → tema="mork")
   så systempreferansen ikke slår gjennom media-queryen.
   ══════════════════════════════════════════════════════════════════════════ */

/* LERRET — v0.1-lysmodusen gjenoppstått som valg: gyllen vegg lyset treffer.
   Varmere og mer scene enn papiret; papiret er roligere å arbeide lenge i. */
:root[data-fargespill="lerret"],
:root:has(#fs-lerret:checked) {
  --f-bunn:        #F7F0DF;
  --f-ark:         #FCF7EA;
  --f-blekk:       #2B2620;
  --f-dempet:      #756B5B;
  --f-hinne:       #E3D9C3;
  --f-lykt:        #8F5B14;
  --f-lykt-mild:   #F2E2C2;
  --f-skygge:      #3D566B;
  --f-skygge-mild: #DDE5EC;
}

/* BLÅTIME — nytt mørkt forslag: timen etter solnedgang, før mørkerommet.
   Skyggeblå grunn der lykta virkelig popper; kjøligere og mer våken enn
   mørkerommets varme ro. Kontrast verifisert 5,8–12:1. */
:root[data-fargespill="blaatime"],
:root:has(#fs-blaatime:checked) {
  --f-bunn:        #232B33;
  --f-ark:         #2C3540;
  --f-blekk:       #EAECE6;
  --f-dempet:      #9AA6AE;
  --f-hinne:       #3C4752;
  --f-lykt:        #E5A94F;
  --f-lykt-mild:   #453B24;
  --f-skygge:      #A3C2DB;
  --f-skygge-mild: #33414F;
  --sg-lav:  0 1px 2px rgba(0, 0, 0, .24);
  --sg-loft: 0 2px 4px rgba(0, 0, 0, .28), 0 8px 24px rgba(0, 0, 0, .24);
  --lys-glod: 0 0 0 2px var(--f-lykt-mild), 0 2px 12px rgba(229, 169, 79, .22);
}

/* ══════════════════════════════════════════════════════════════════════════
   LYSARK — SYSTEM  v0.1
   Elementer og komponenter. Leser KUN tokens — ingen hex, px eller rgba her
   utover token-referanser. Holdes med vilje lite: komponenter fødes i
   demoen/Laterna og flyttes hit først når de er stabile.
   ══════════════════════════════════════════════════════════════════════════ */

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--f-bunn);
  color: var(--f-blekk);
  font-family: var(--sk-tekst);
  font-size: var(--sk-brod);
  line-height: 1.55;
  transition: background var(--bv-myk), color var(--bv-myk);
}

h1, h2, h3 {
  font-family: var(--sk-display);
  font-weight: 600;
  line-height: 1.2;
  margin: 0 0 var(--r-3);
}
h1 { font-size: var(--sk-scene); }
h2 { font-size: var(--sk-tittel); }
h3 { font-size: var(--sk-stor); }

a { color: var(--f-skygge); text-decoration-color: var(--f-hinne); }

/* Flate — gruppering med tone og luft, aldri ramme */
.flate {
  background: var(--flate-bunn);
  border: 1px solid var(--flate-ramme);
  box-shadow: var(--flate-skygge);
  border-radius: var(--rad-flate);
  padding: var(--r-4);
}

/* Gløden — PARKERT som valgfri markør (Lars 2026-09-04: vanlige kort står
   alene). Tokenet beholdes; brukes kun der noe virkelig må lyse. */
.glod { box-shadow: var(--lys-glod); }

/* Knapp — STANDARDHANDLINGEN (Lars 2026-09-04): ren tekst som lyser opp
   med markering under ved hover. Markøren er husets understrek-språk —
   samme strek markerer aktiv tilstand (.aktiv / aria-expanded). */
.knapp {
  background: none; border: none; font: inherit;
  font-size: var(--sk-liten); color: var(--f-blekk);
  padding: var(--r-1) 2px; cursor: pointer; position: relative;
  transition: color var(--bv-rask);
}
.knapp::after {
  content: ''; position: absolute; left: 0; right: 0; bottom: -2px;
  height: 2px; border-radius: var(--rad-pille); background: var(--f-lykt);
  transform: scaleX(0); transform-origin: left;
  transition: transform var(--bv-rask);
}
.knapp:hover { color: var(--f-lykt); }
.knapp:hover::after, .knapp.aktiv::after, .knapp[aria-expanded="true"]::after {
  transform: scaleX(1);
}

/* Meny — redigeringsknapp som åpner rullegardin. Grupper av funksjoner
   skilles med tynne svake streker (.meny-skille), aldri med rammer. */
.meny { position: relative; display: inline-block; }
.meny-panel {
  position: absolute; top: calc(100% + var(--r-2)); left: 0; z-index: 10;
  min-width: 190px; padding: var(--r-2);
  background: var(--f-ark); border-radius: var(--rad-stor);
  box-shadow: var(--sg-loft); display: none;
}
.meny.open .meny-panel { display: block; }
.meny-punkt {
  display: block; width: 100%; text-align: left;
  background: none; border: none; font: inherit; font-size: var(--sk-liten);
  color: var(--f-blekk); padding: var(--r-1) var(--r-2);
  border-radius: var(--rad-liten); cursor: pointer;
}
.meny-punkt:hover { background: var(--f-lykt-mild); }
.meny-skille { border: 0; border-top: 1px solid var(--f-hinne); margin: var(--r-1) var(--r-2); }

/* Pille — DEMOTERT til sjelden primærhandling (én per flate, maks). */
.pille {
  display: inline-flex;
  align-items: center;
  gap: var(--r-2);
  border: none;
  border-radius: var(--rad-pille);
  padding: var(--r-2) var(--r-3);
  background: var(--f-lykt-mild);
  color: var(--f-blekk);
  font: inherit;
  font-size: var(--sk-liten);
  cursor: pointer;
  transition: background var(--bv-rask), box-shadow var(--bv-rask);
}
.pille:hover { box-shadow: var(--sg-lav); }
.pille--primar { background: var(--f-lykt); color: var(--f-bunn); }

/* Etikett — mono i versaler, alltid sperret */
.etikett {
  font-family: var(--sk-data);
  font-size: var(--sk-mikro);
  letter-spacing: var(--sp-label);
  text-transform: uppercase;
  color: var(--f-dempet);
}

/* Hårstrek */
.hinne { border: 0; border-top: 1px solid var(--f-hinne); margin: var(--r-4) 0; }

/* Rullefelt — bare tommelen: intet spor, ingen piler. Tynn hinne-strek som
   mørkner ved hover. (scrollbar-color for moderne motorer; -webkit-fallback.) */
* { scrollbar-width: thin; scrollbar-color: var(--f-hinne) transparent; }
*::-webkit-scrollbar { width: 6px; height: 6px; background: transparent; }
*::-webkit-scrollbar-track { background: transparent; }
*::-webkit-scrollbar-thumb { background: var(--f-hinne); border-radius: var(--rad-pille); }
*::-webkit-scrollbar-thumb:hover { background: var(--f-dempet); }
*::-webkit-scrollbar-button { display: none; width: 0; height: 0; }
*::-webkit-scrollbar-corner { background: transparent; }

/* Dempet sekundærtekst */
.dempet { color: var(--f-dempet); }

</style>
<style>
  /* ── Lucida: hele flaten ER lerretet — nå med kamera (pan/zoom).
     Alt innhold bor i #kamera og flyttes/skaleres som én verden. ── */
  html, body { height: 100%; }
  body { overflow: hidden; background: var(--f-bunn); }

  .topp {
    position: fixed; inset: 0 0 auto 0; z-index: 20;
    display: flex; align-items: center; gap: var(--r-3);
    padding: var(--r-2) var(--r-3);
    transition: opacity var(--bv-myk);
  }
  body.tegner .topp { opacity: 0; pointer-events: none; }

  .ordmerke { display: flex; align-items: center; gap: var(--r-2); }
  .ordmerke svg { width: 30px; height: 32px; color: var(--f-blekk); }
  .ordmerke b { font-family: var(--sk-display); font-weight: 600;
                font-size: var(--sk-stor); color: var(--f-blekk);
                letter-spacing: .01em; }
  .kontekst { font-size: var(--sk-liten); color: var(--f-dempet); }
  .luft { flex: 1; }

  .tilbake { border: none; background: none; cursor: pointer;
             font: inherit; font-size: var(--sk-liten);
             color: var(--f-dempet); padding: var(--r-1) var(--r-2);
             border-radius: var(--rad-liten);
             transition: color var(--bv-rask); }
  .tilbake:hover { color: var(--f-lykt); }

  /* kilde-chipen: dokket øverst i midten — dras inn på lerretet */
  .kilde-dokk { position: fixed; top: 46px; left: 50%;
                transform: translateX(-50%); z-index: 20;
                transition: opacity var(--bv-myk); }
  body.tegner .kilde-dokk { opacity: 0; pointer-events: none; }
  .kilde-chip { display: inline-flex; align-items: center; gap: 6px;
                font-family: var(--sk-data); font-size: var(--sk-nano);
                letter-spacing: var(--sp-label); text-transform: uppercase;
                color: var(--f-dempet); background: var(--f-ark);
                border: 1px dashed var(--f-hinne); border-radius: var(--rad-pille);
                padding: 5px 12px; cursor: grab; user-select: none;
                transition: color var(--bv-rask), box-shadow var(--bv-rask); }
  .kilde-chip:hover { color: var(--f-lykt); box-shadow: var(--lys-glod); }
  #kilde-spokelse { position: fixed; z-index: 40; pointer-events: none;
                    opacity: .8; display: none; }

  /* ── Vinduet + kameraet ── */
  #vindu { position: fixed; inset: 0; overflow: hidden;
           touch-action: none; }
  #vindu.modus-tegn  { cursor: crosshair; }
  #vindu.modus-peker { cursor: grab; }
  #vindu.modus-peker.panorerer { cursor: grabbing; }
  #vindu.modus-visk  { cursor: cell; }
  #kamera { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #lerret { position: absolute; left: 0; top: 0; overflow: visible;
            width: 10px; height: 10px; }
  #lerret .strok { fill: none; stroke: var(--f-blekk); stroke-width: 1.7;
                   stroke-linecap: round; stroke-linejoin: round; }
  #lerret .node-ring { stroke: var(--f-blekk); stroke-width: 2;
                       fill: var(--f-lykt-mild); fill-opacity: 0; }
  #lerret .node-ring.fodt { animation: node-fodsel 700ms var(--bv-myk) forwards; }
  @keyframes node-fodsel {
    0%   { fill-opacity: 0; }
    45%  { fill-opacity: .55; }
    100% { fill-opacity: .28; }
  }
  .claude { stroke: #D97757 !important; stroke-dasharray: 7 6; }

  .aa-knapp {
    position: absolute; z-index: 15;
    width: 30px; height: 30px; border-radius: var(--rad-pille);
    border: 1px solid var(--f-hinne); background: var(--f-ark);
    box-shadow: var(--sg-lav); cursor: pointer;
    font-family: var(--sk-display); font-size: 14px; color: var(--f-lykt);
    display: grid; place-items: center;
    opacity: 0; transform: scale(.6);
    transition: opacity var(--bv-myk), transform var(--bv-myk);
  }
  .aa-knapp.vis { opacity: 1; transform: scale(1); }
  .aa-knapp:hover { box-shadow: var(--lys-glod); }
  .maskintekst { font-family: var(--sk-tekst); font-size: var(--sk-brod);
                 fill: var(--f-blekk); }
  .maskintekst.inn { animation: tekst-inn 500ms var(--bv-myk) both; }
  @keyframes tekst-inn { from { opacity: 0; } to { opacity: 1; } }

  /* ── Kort ── */
  .flytende { position: absolute; z-index: 10; }
  .kort { width: 218px; padding: var(--r-2) var(--r-3);
          background: var(--f-ark); border: 1px solid var(--f-hinne);
          border-radius: var(--rad-stor); box-shadow: var(--sg-lav);
          font-size: var(--sk-mikro); line-height: 1.45; color: var(--f-blekk); }
  .kort .kilde { display: block; margin-top: 6px;
                 font-family: var(--sk-data); font-size: var(--sk-nano);
                 letter-spacing: var(--sp-label); text-transform: uppercase;
                 color: var(--f-dempet); }
  .kort.forslag { border: 1px dashed #D97757; background: transparent; }
  .kort.forslag .kilde { color: #D97757; }
  .kort.ufordelt { border-style: dashed; opacity: .85; }

  /* dok-lenke-kortet: tom lenke → klikk for å redigere → klikk åpner */
  .kort.lenke { width: auto; max-width: 260px; cursor: pointer;
                display: inline-flex; align-items: center; gap: 8px;
                white-space: nowrap; }
  .kort.lenke .tekst { overflow: hidden; text-overflow: ellipsis; }
  .kort.lenke svg { width: 15px; height: 15px; flex: none;
                    color: var(--f-lykt); }
  .kort.lenke.tom { border-style: dashed; color: var(--f-dempet); }
  .kort.lenke:hover { box-shadow: var(--lys-glod); }
  .kort.lenke .rediger { font-size: var(--sk-nano); color: var(--f-dempet);
                         padding: 2px 4px; border-radius: var(--rad-liten); }
  .kort.lenke .rediger:hover { color: var(--f-lykt); }

  .anker { display: inline-flex; align-items: center; gap: 5px;
           border: none; cursor: pointer; font: inherit;
           font-family: var(--sk-data); font-size: var(--sk-nano);
           letter-spacing: var(--sp-label); text-transform: uppercase;
           color: var(--f-lykt); background: var(--f-lykt-mild);
           padding: 3px 9px; border-radius: var(--rad-pille);
           transition: box-shadow var(--bv-rask); }
  .anker:hover { box-shadow: var(--lys-glod); }

  /* hover-velgeren: «tilknytt tema» dukker opp over noden du peker på */
  #ankervelger { position: absolute; z-index: 16; display: flex;
                 flex-direction: column; align-items: center; gap: 4px; }
  .anker.los { border: 1px dashed var(--f-lykt); background: transparent; }
  .anker-meny { display: none; flex-direction: column; gap: 2px;
                background: var(--f-ark); border: 1px solid var(--f-hinne);
                border-radius: var(--rad-stor); box-shadow: var(--sg-loft);
                padding: var(--r-1); }
  #ankervelger.apen .anker-meny { display: flex; }
  .anker-punkt { border: none; background: none; cursor: pointer; font: inherit;
                 font-size: var(--sk-mikro); color: var(--f-blekk);
                 padding: 5px 10px; border-radius: var(--rad-liten);
                 text-align: left; white-space: nowrap; }
  .anker-punkt:hover { background: var(--f-lykt-mild); }

  /* størrelses-grip: nede til høyre på kort, synlig ved hover */
  .kort { position: relative; }
  .grip { position: absolute; right: 3px; bottom: 3px; width: 14px; height: 14px;
          cursor: nwse-resize; color: var(--f-dempet); opacity: 0;
          transition: opacity var(--bv-rask); touch-action: none; }
  .kort:hover .grip { opacity: 1; }
  .grip svg { width: 100%; height: 100%; display: block; }

  /* ── Verktøylinja: modus-ikoner i husets strek + figur-dropup ── */
  .verktoy { position: fixed; bottom: var(--r-3); left: 50%;
             transform: translateX(-50%); z-index: 20;
             display: flex; gap: 2px; align-items: center;
             padding: var(--r-1) var(--r-2);
             background: var(--f-ark); border: 1px solid var(--f-hinne);
             border-radius: var(--rad-pille); box-shadow: var(--sg-loft);
             transition: opacity var(--bv-myk); }
  body.tegner .verktoy { opacity: 0; }
  .vk { border: none; background: none; cursor: pointer;
        width: 36px; height: 32px; border-radius: var(--rad-liten);
        display: grid; place-items: center; color: var(--f-dempet);
        transition: color var(--bv-rask), background var(--bv-rask); }
  .vk:hover { color: var(--f-blekk); }
  .vk.aktiv { color: var(--f-lykt); background: var(--f-lykt-mild); }
  .vk svg { width: 18px; height: 18px; }
  .vk .ikon { stroke: currentColor; stroke-width: 1.7; fill: none;
              stroke-linecap: round; stroke-linejoin: round; }
  .vk-skille { width: 1px; height: 18px; background: var(--f-hinne);
               margin: 0 4px; }
  .vk-tekst { border: none; background: none; cursor: pointer; font: inherit;
              font-size: var(--sk-mikro); color: var(--f-dempet);
              padding: 6px 10px; border-radius: var(--rad-pille);
              transition: color var(--bv-rask); }
  .vk-tekst:hover { color: var(--f-lykt); }

  /* figur-dropup */
  .dropp { position: relative; }
  .dropp-panel { position: absolute; bottom: 42px; left: 50%;
                 transform: translateX(-50%) translateY(6px);
                 display: flex; flex-direction: column; gap: 2px;
                 background: var(--f-ark); border: 1px solid var(--f-hinne);
                 border-radius: var(--rad-stor); box-shadow: var(--sg-loft);
                 padding: var(--r-1); opacity: 0; pointer-events: none;
                 transition: opacity var(--bv-rask), transform var(--bv-rask);
                 white-space: nowrap; }
  .dropp.apen .dropp-panel { opacity: 1; pointer-events: auto;
                             transform: translateX(-50%) translateY(0); }
  .dropp-punkt { border: none; background: none; cursor: pointer; font: inherit;
                 font-size: var(--sk-mikro); color: var(--f-blekk);
                 display: flex; align-items: center; gap: 8px;
                 padding: 6px 10px; border-radius: var(--rad-liten);
                 text-align: left; }
  .dropp-punkt:hover { background: var(--f-lykt-mild); color: var(--f-blekk); }
  .dropp-punkt svg { width: 15px; height: 15px; color: var(--f-dempet); }
  .dropp-punkt .ikon { stroke: currentColor; stroke-width: 1.7; fill: none;
                       stroke-linecap: round; stroke-linejoin: round; }

  /* pennepanelet: 8 farger som hører hjemme i mørkerommet + tre strektyper */
  .penn-panel { flex-direction: column; gap: 8px; padding: var(--r-2); }
  .farger { display: flex; gap: 5px; }
  .farge { width: 19px; height: 19px; border-radius: 50%; cursor: pointer;
           background: var(--fv); border: 2px solid transparent;
           transition: transform var(--bv-rask), border-color var(--bv-rask); }
  .farge:hover { transform: scale(1.15); }
  .farge.aktiv { border-color: var(--f-blekk); }
  .stiler { display: flex; gap: 2px; }
  .stil { border: none; background: none; cursor: pointer; font: inherit;
          font-size: var(--sk-mikro); color: var(--f-blekk);
          padding: 4px 9px; border-radius: var(--rad-liten); }
  .stil:hover { background: var(--f-lykt-mild); }
  .stil.aktiv { background: var(--f-lykt-mild); color: var(--f-lykt); }

  /* bilder på lerretet: ting å feste tanker på */
  .kort.bilde { padding: 4px; width: auto; }
  .kort.bilde img { display: block; max-width: 300px;
                    border-radius: calc(var(--rad-stor) - 3px); }

  #tomhint { position: fixed; inset: 0; display: grid; place-items: center;
             pointer-events: none; transition: opacity var(--bv-treg); }
  #tomhint p { font-family: var(--sk-display); font-size: var(--sk-stor);
               color: var(--f-dempet); opacity: .7; text-align: center;
               line-height: 1.6; }
  body.har-innhold #tomhint { opacity: 0; }

  #status { position: fixed; bottom: var(--r-3); right: var(--r-3);
            font-size: var(--sk-mikro); color: var(--f-dempet);
            opacity: 0; transition: opacity var(--bv-myk); z-index: 20; }
  #status.vis { opacity: 1; }
  #zoomvis { position: fixed; bottom: var(--r-3); left: var(--r-3);
             font-family: var(--sk-data); font-size: var(--sk-nano);
             color: var(--f-dempet); z-index: 20; }
</style>
</head>

<div id="status"></div>
<div id="zoomvis">100 %</div>

<script>
/* ── Lucida UX-mock v2: kamera (pan/zoom), moduser (tegn/peker/visk),
   figurer + dok-lenker, kilde-drag. Alt innhold i verdens-koordinater
   inne i #kamera; skjerm→verden = (p - t) / s. Aldri piksler i data. ── */
const vindu = document.getElementById('vindu');
const kamera = document.getElementById('kamera');
const svg = document.getElementById('lerret');
const NS = 'http://www.w3.org/2000/svg';

let kam = { s: 1, tx: 0, ty: 0 };
let modus = 'tegn';
let punkter = [], aktivSti = null;
let stroker = [], noder = [];   // stroker: {el, pkt}

function status(t) {
  const s = document.getElementById('status');
  s.textContent = t; s.classList.add('vis');
  clearTimeout(status._t);
  status._t = setTimeout(() => s.classList.remove('vis'), 3200);
}
function tegnKamera(myk) {
  kamera.style.transition = myk ? 'transform 550ms cubic-bezier(.22,1,.36,1)' : 'none';
  kamera.style.transform = `translate(${kam.tx}px, ${kam.ty}px) scale(${kam.s})`;
  document.getElementById('zoomvis').textContent = Math.round(kam.s * 100) + ' %';
}
function tilVerden(e) {
  return [(e.clientX - kam.tx) / kam.s, (e.clientY - kam.ty) / kam.s];
}
/* prompt() finnes ikke i alle innebygde nettlesere — fall pent tilbake */
function spor(tekst, forslag) {
  try { return prompt(tekst, forslag || ''); }
  catch { status('Denne nettleseren støtter ikke dialoger — i ekte: inline-redigering'); return null; }
}
function stiD(pkt) {
  return pkt.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
}

/* ── pennen: farge ('' = standard blekk-krem) og strektype ── */
const penn = { farge: '', stil: 'ren' };
function blyantKlikk() {
  const dp = document.getElementById('penn-dropp');
  if (modus === 'tegn') dp.classList.toggle('apen');
  else { settModus('tegn'); dp.classList.remove('apen'); }
}
function velgFarge(f, el) {
  penn.farge = f;
  document.querySelectorAll('.farge').forEach(x => x.classList.toggle('aktiv', x === el));
}
function velgStil(s, el) {
  penn.stil = s;
  document.querySelectorAll('.stil').forEach(x => x.classList.toggle('aktiv', x === el));
}

/* blekkblyanten: fart → fylde. Sakte strøk = tykk vått-blekk-linje, raske
   sveip = tynne. Ribbonen bygges som fylt polygon rundt strøket. */
function blekkRibbon(pkt, farge) {
  const w = [];
  for (let i = 0; i < pkt.length; i++) {
    const f = i ? Math.hypot(pkt[i][0] - pkt[i-1][0], pkt[i][1] - pkt[i-1][1]) : 2;
    w.push(Math.max(.9, Math.min(4.6, 5.2 / (1 + f / 6))));
  }
  for (let r = 0; r < 2; r++)                    // glatt fylden litt
    for (let i = 1; i < w.length - 1; i++) w[i] = (w[i-1] + w[i] * 2 + w[i+1]) / 4;
  const v = [], h = [];
  for (let i = 0; i < pkt.length; i++) {
    const a = pkt[Math.max(0, i - 1)], b = pkt[Math.min(pkt.length - 1, i + 1)];
    const dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1;
    const nx = -dy / l, ny = dx / l;
    v.push([pkt[i][0] + nx * w[i] / 2, pkt[i][1] + ny * w[i] / 2]);
    h.push([pkt[i][0] - nx * w[i] / 2, pkt[i][1] - ny * w[i] / 2]);
  }
  const p = document.createElementNS(NS, 'path');
  p.setAttribute('d', stiD(v.concat(h.reverse())) + ' Z');
  p.setAttribute('fill', farge || 'var(--f-blekk)');
  return p;
}

function settModus(m) {
  modus = m;
  vindu.className = 'modus-' + m;
  ['tegn', 'peker', 'visk'].forEach(x =>
    document.getElementById('m-' + x).classList.toggle('aktiv', x === m));
}
function byttDropp() {
  document.getElementById('figur-dropp').classList.toggle('apen');
}

/* ── Pekerlogikk: tegn / panorér / visk — pluss inngangs-adaptivitet:
   midtknappen (hjulklikk) panorerer alltid på PC, to fingre panorerer
   og kniper (pinch-zoom) på nettbrett, uansett aktiv modus. ── */
let panStart = null;
let dragNode = null;        // node som dras i peker-modus
const pekere = new Map();   // pointerId → skjermpunkt
let knip = null;            // aktiv to-finger-gest

vindu.addEventListener('pointerdown', (e) => {
  if (e.target.closest('.flytende, .aa-knapp, #ankervelger')) return;
  document.getElementById('figur-dropp').classList.remove('apen');
  vindu.setPointerCapture(e.pointerId);
  pekere.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (pekere.size === 2) {
    // finger nr. to: avbryt evt. påbegynt strøk og gå i knip-modus
    if (aktivSti) { aktivSti.remove(); aktivSti = null; punkter = [];
                    document.body.classList.remove('tegner'); }
    const [a, b] = [...pekere.values()];
    knip = { avstand: Math.hypot(a.x - b.x, a.y - b.y) || 1, s: kam.s,
             midt: { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 },
             tx: kam.tx, ty: kam.ty };
    panStart = null;
    return;
  }
  if (e.button === 1) {
    e.preventDefault();
    panStart = { x: e.clientX, y: e.clientY, tx: kam.tx, ty: kam.ty };
    vindu.classList.add('panorerer');
    return;
  }
  if (modus === 'tegn') {
    document.getElementById('penn-dropp').classList.remove('apen');
    document.body.classList.add('tegner', 'har-innhold');
    punkter = [tilVerden(e)];
    aktivSti = document.createElementNS(NS, 'path');
    aktivSti.setAttribute('class', 'strok');
    if (penn.farge) aktivSti.style.stroke = penn.farge;
    if (penn.stil === 'stiplet') aktivSti.style.strokeDasharray = '7 6';
    aktivSti.dataset.stil = penn.stil; aktivSti.dataset.farge = penn.farge;
    svg.appendChild(aktivSti);
  } else if (modus === 'peker') {
    // treffer du en node → dra den; ellers panorér
    const [vx, vy] = tilVerden(e);
    const n = noder.find(n => vx > n.boks.x && vx < n.boks.x + n.boks.b &&
                              vy > n.boks.y && vy < n.boks.y + n.boks.h);
    if (n) {
      dragNode = { n, sx: vx, sy: vy,
                   base: { ...(n.off || { x: 0, y: 0 }) },
                   boks0: { x: n.boks.x, y: n.boks.y } };
      if (velger) { velger.remove(); velger = null; velgerNode = null; }
    } else {
      panStart = { x: e.clientX, y: e.clientY, tx: kam.tx, ty: kam.ty };
      vindu.classList.add('panorerer');
    }
  } else if (modus === 'visk') {
    visk(e);
  }
});
vindu.addEventListener('pointermove', (e) => {
  if (pekere.has(e.pointerId)) pekere.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (knip && pekere.size >= 2) {
    const [a, b] = [...pekere.values()];
    const avstand = Math.hypot(a.x - b.x, a.y - b.y) || 1;
    const midt = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    const nyS = Math.min(4, Math.max(0.15, knip.s * avstand / knip.avstand));
    kam.tx = midt.x - (knip.midt.x - knip.tx) * (nyS / knip.s);
    kam.ty = midt.y - (knip.midt.y - knip.ty) * (nyS / knip.s);
    kam.s = nyS;
    tegnKamera(false);
    return;
  }
  if (dragNode) {
    const [vx, vy] = tilVerden(e);
    const dx = vx - dragNode.sx, dy = vy - dragNode.sy;
    const n = dragNode.n;
    n.off = { x: dragNode.base.x + dx, y: dragNode.base.y + dy };
    const t = `translate(${n.off.x} ${n.off.y})`;
    n.ring.setAttribute('transform', t);
    n.skrifter.forEach(s => s.setAttribute('transform', t));
    if (n.tekst) n.tekst.setAttribute('transform', t);
    n.boks.x = dragNode.boks0.x + dx; n.boks.y = dragNode.boks0.y + dy;
    if (n.aa) { n.aa.style.left = (n.boks.x + n.boks.b - 8) + 'px';
                n.aa.style.top = (n.boks.y - 8) + 'px'; }
    return;
  }
  if (aktivSti) {
    punkter.push(tilVerden(e));
    aktivSti.setAttribute('d', stiD(punkter));
  } else if (panStart) {
    kam.tx = panStart.tx + (e.clientX - panStart.x);
    kam.ty = panStart.ty + (e.clientY - panStart.y);
    tegnKamera(false);
  } else if (modus === 'visk' && e.buttons) {
    visk(e);
  } else if (!e.buttons) {
    visAnkerHover(e);
  }
});
function slippPeker(e) {
  pekere.delete(e.pointerId);
  if (pekere.size < 2) knip = null;
  document.body.classList.remove('tegner');
  vindu.classList.remove('panorerer');
  if (aktivSti) { ferdigStrok(aktivSti, punkter); aktivSti = null; punkter = []; }
  panStart = null; dragNode = null;
}
vindu.addEventListener('pointerup', slippPeker);
vindu.addEventListener('pointercancel', slippPeker);
/* Chrome starter autoscroll på midtklikk — stopp den */
vindu.addEventListener('mousedown', (e) => { if (e.button === 1) e.preventDefault(); });

/* ── hover over en node → «tilknytt tema»-velger med deckets temaslides ── */
const TEMAER = ['01 · forsiden', '02 · kollapsen', '03 · arbeidsrådet'];
let velger = null, velgerNode = null;
function visAnkerHover(e) {
  if (e.pointerType === 'touch') return;
  if (e.target.closest('#ankervelger')) return;
  const [vx, vy] = tilVerden(e);
  const n = noder.find(n => vx > n.boks.x && vx < n.boks.x + n.boks.b &&
                            vy > n.boks.y && vy < n.boks.y + n.boks.h);
  if (n === velgerNode) return;
  if (velger) { velger.remove(); velger = null; }
  velgerNode = n || null;
  if (!n || n.anker) return;
  velger = document.createElement('div');
  velger.id = 'ankervelger';
  velger.style.left = (n.boks.x + n.boks.b / 2 - 60) + 'px';
  velger.style.top = (n.boks.y - 14) + 'px';
  /* chipen skal være liten — og skalere med sirkelen den tilhører */
  const sk = Math.max(.5, Math.min(.85, n.boks.b / 480));
  velger.style.transform = `scale(${sk})`;
  velger.style.transformOrigin = 'center bottom';
  velger.innerHTML = '<button class="anker los">tilknytt tema ▾</button>' +
    '<span class="anker-meny">' +
    TEMAER.map(t => `<button class="anker-punkt">→ ${t}</button>`).join('') +
    '</span>';
  kamera.appendChild(velger);
  velger.querySelector('.los').onclick = () => velger.classList.toggle('apen');
  velger.querySelectorAll('.anker-punkt').forEach((k, i) => k.onclick = () => {
    n.anker = TEMAER[i];
    velger.remove(); velger = null; velgerNode = null;
    const d = document.createElement('div');
    d.className = 'flytende';
    d.style.left = (n.boks.x + n.boks.b / 2 - 55) + 'px';
    d.style.top = (n.boks.y - 14) + 'px';
    d.style.transform = `scale(${sk})`;
    d.style.transformOrigin = 'center bottom';
    d.innerHTML = `<button class="anker" onclick="tilSlide()">→ ${TEMAER[i]}</button>`;
    kamera.appendChild(d);
    gjorDrabar(d);
    status('Noden er forankret til ' + TEMAER[i] + ' — chipen hopper til sliden');
  });
}

/* zoom: hjul (og pinch via ctrl+hjul på pekeplater) mot pekeren */
vindu.addEventListener('wheel', (e) => {
  e.preventDefault();
  const f = Math.exp(-e.deltaY * 0.0016);
  const nyS = Math.min(4, Math.max(0.15, kam.s * f));
  kam.tx = e.clientX - (e.clientX - kam.tx) * (nyS / kam.s);
  kam.ty = e.clientY - (e.clientY - kam.ty) * (nyS / kam.s);
  kam.s = nyS;
  tegnKamera(false);
}, { passive: false });

/* dobbeltklikk i en node → zoom inn i den (nodene er små utenfra,
   uendelige innenfra — plassen til notatene bor i zoomen) */
vindu.addEventListener('dblclick', (e) => {
  const [vx, vy] = tilVerden(e);
  const n = noder.find(n => vx > n.boks.x && vx < n.boks.x + n.boks.b &&
                            vy > n.boks.y && vy < n.boks.y + n.boks.h);
  if (!n) return;
  const mål = Math.min(4, Math.min(
    innerWidth * .8 / n.boks.b, innerHeight * .8 / n.boks.h));
  kam.s = mål;
  kam.tx = innerWidth / 2 - (n.boks.x + n.boks.b / 2) * mål;
  kam.ty = innerHeight / 2 - (n.boks.y + n.boks.h / 2) * mål;
  tegnKamera(true);
  status('Zoomet inn i noden — her bor notatplassen');
});

function visk(e) {
  const [vx, vy] = tilVerden(e);
  const r = 14 / kam.s;
  for (let i = stroker.length - 1; i >= 0; i--) {
    const s = stroker[i];
    if (s.pkt && s.pkt.some(p => Math.hypot(p[0] - vx, p[1] - vy) < r)) {
      s.el.remove(); stroker.splice(i, 1);
      const ni = noder.findIndex(n => n.ring === s.el);
      if (ni >= 0) { if (noder[ni].aa) noder[ni].aa.remove(); noder.splice(ni, 1); }
      break;
    }
  }
}

/* ── sirkelgjenkjenning (som før, i verdens-koordinater) ── */
function ferdigStrok(sti, pkt) {
  stroker.push({ el: sti, pkt });
  if (pkt.length < 12) return;
  const xs = pkt.map(p => p[0]), ys = pkt.map(p => p[1]);
  const boks = { x: Math.min(...xs), y: Math.min(...ys),
                 b: Math.max(...xs) - Math.min(...xs),
                 h: Math.max(...ys) - Math.min(...ys) };
  const diag = Math.hypot(boks.b, boks.h);
  const gap = Math.hypot(pkt[0][0] - pkt.at(-1)[0], pkt[0][1] - pkt.at(-1)[1]);
  let lengde = 0;
  for (let i = 1; i < pkt.length; i++)
    lengde += Math.hypot(pkt[i][0] - pkt[i-1][0], pkt[i][1] - pkt[i-1][1]);
  const lukket = gap < Math.max(28 / kam.s, diag * .22);
  const rund = lengde > diag * 1.6 && boks.b > 40 && boks.h > 35;
  if (lukket && rund) {
    sti.setAttribute('d', stiD(pkt) + ' Z');
    sti.setAttribute('class', 'node-ring fodt');
    noder.push({ ring: sti, boks, skrifter: [] });
    status('Sirkel gjenkjent → idé-node (dobbeltklikk for å zoome inn)');
  } else {
    if (sti.dataset.stil === 'blekk') {
      // bytt den tynne live-linja mot blekk-ribbonen med fylde
      const rib = blekkRibbon(pkt, sti.dataset.farge);
      svg.replaceChild(rib, sti);
      stroker[stroker.length - 1].el = rib;
      sti = rib;
    }
    const node = noder.find(n =>
      boks.x > n.boks.x && boks.y > n.boks.y &&
      boks.x + boks.b < n.boks.x + n.boks.b &&
      boks.y + boks.h < n.boks.y + n.boks.h);
    if (node) { node.skrifter.push(sti); visAaKnapp(node); }
  }
}

/* ── bilde fra maskinen → kort på lerretet (dra + skaler som alt annet) ── */
document.getElementById('bilde-fil').addEventListener('change', (e) => {
  const fil = e.target.files[0];
  if (!fil) return;
  const leser = new FileReader();
  leser.onload = () => {
    document.body.classList.add('har-innhold');
    const cx = (innerWidth / 2 - kam.tx) / kam.s;
    const cy = (innerHeight / 2 - kam.ty) / kam.s;
    const d = document.createElement('div');
    d.className = 'flytende';
    d.style.left = (cx - 150) + 'px'; d.style.top = (cy - 100) + 'px';
    d.innerHTML = `<div class="kort bilde"><img src="${leser.result}" alt="${fil.name}"></div>`;
    kamera.appendChild(d);
    gjorSkalerbar(d.firstChild);
    gjorDrabar(d);
    status('Bilde lagt inn — i ekte lagres fila i kilder/ (aldri bakt inn)');
  };
  leser.readAsDataURL(fil);
  e.target.value = '';
});

function visAaKnapp(node) {
  if (node.aa) return;
  const k = document.createElement('button');
  k.className = 'aa-knapp'; k.textContent = 'Aa';
  k.title = 'Gjør håndskriften til maskintekst';
  k.style.left = (node.boks.x + node.boks.b - 8) + 'px';
  k.style.top = (node.boks.y - 8) + 'px';
  kamera.appendChild(k);
  requestAnimationFrame(() => k.classList.add('vis'));
  node.aa = k;
  k.onclick = () => {
    const t = spor('Mocken jukser: hva skrev du?') || 'et poeng';
    node.skrifter.forEach(s => { s.remove();
      const i = stroker.findIndex(x => x.el === s); if (i >= 0) stroker.splice(i, 1); });
    node.skrifter = [];
    const tekst = document.createElementNS(NS, 'text');
    tekst.setAttribute('class', 'maskintekst inn');
    /* boks følger draingen, men transformen legges oppå — trekk den fra */
    tekst.setAttribute('x', node.boks.x - (node.off ? node.off.x : 0) + node.boks.b / 2);
    tekst.setAttribute('y', node.boks.y - (node.off ? node.off.y : 0) + node.boks.h / 2);
    tekst.setAttribute('text-anchor', 'middle');
    tekst.textContent = t;
    if (node.off) tekst.setAttribute('transform', `translate(${node.off.x} ${node.off.y})`);
    svg.appendChild(tekst);
    node.tekst = tekst;
    k.remove(); node.aa = null;
    status('Håndskrift → maskintekst (i ekte: via innboksen, lokalt)');
  };
}

function angre() {
  const s = stroker.pop();
  if (!s) return;
  s.el.remove();
  const ni = noder.findIndex(n => n.ring === s.el);
  if (ni >= 0) { if (noder[ni].aa) noder[ni].aa.remove(); noder.splice(ni, 1); }
  if (!stroker.length) document.body.classList.remove('har-innhold');
}

/* ── Figurer fra dropup: settes midt i synsfeltet ── */
function settFigur(type) {
  byttDropp();
  document.body.classList.add('har-innhold');
  const cx = (innerWidth / 2 - kam.tx) / kam.s;
  const cy = (innerHeight / 2 - kam.ty) / kam.s;
  if (type === 'sirkel') {
    lagNodeSti(vinglSirkel(cx, cy, 130, 100), cx - 130, cy - 100, 260, 200);
    status('Sirkel — idé-node satt inn');
  } else if (type === 'rekt') {
    lagNodeSti(vinglRekt(cx - 150, cy - 90, 300, 180), cx - 150, cy - 90, 300, 180);
    status('Notatfelt satt inn — dobbeltklikk for å zoome inn og skrive');
  } else if (type === 'lenke') {
    lagLenkekort(cx - 90, cy - 20);
  }
}
function lagNodeSti(d, x, y, b, h) {
  const p = document.createElementNS(NS, 'path');
  p.setAttribute('class', 'node-ring fodt');
  p.setAttribute('d', d);
  svg.appendChild(p);
  const pkt = [[x, y], [x + b, y], [x + b, y + h], [x, y + h]];
  stroker.push({ el: p, pkt });
  noder.push({ ring: p, boks: { x, y, b, h }, skrifter: [] });
}

/* ── Dok-lenkekortet: tomt → klikk redigerer; satt → klikk åpner ── */
function lagLenkekort(x, y, url) {
  const d = document.createElement('div');
  d.className = 'flytende';
  d.style.left = x + 'px'; d.style.top = y + 'px';
  const kort = document.createElement('div');
  kort.className = 'kort lenke tom';
  kort.innerHTML = '<svg viewBox="0 0 16 16"><path class="ikon" stroke="currentColor" ' +
    'stroke-width="1.7" fill="none" stroke-linecap="round" ' +
    'd="M6.8 9.2 L9.2 6.8 M5.5 10.5 Q3.6 12.4 5.1 13.9 Q6.6 15.4 8.5 13.5 L9.9 12.1 ' +
    'M10.5 5.5 Q12.4 3.6 10.9 2.1 Q9.4 .6 7.5 2.5 L6.1 3.9"/></svg>' +
    '<span class="tekst">tom lenke — klikk for å legge inn</span>' +
    '<span class="rediger" title="Rediger lenken">✎</span>';
  d.appendChild(kort);
  kamera.appendChild(d);
  const tekst = kort.querySelector('.tekst');
  const sett = (u) => {
    kort.dataset.url = u;
    kort.classList.toggle('tom', !u);
    tekst.textContent = u
      ? (u.startsWith('http') ? u.replace(/^https?:\/\//, '').slice(0, 34) : '📄 ' + u.split(/[\\/]/).pop())
      : 'tom lenke — klikk for å legge inn';
  };
  if (url) sett(url);
  gjorSkalerbar(kort);
  gjorDrabar(d);
  kort.addEventListener('click', (e) => {
    if (e.target.closest('.grip')) return;
    const u = kort.dataset.url;
    if (!u || e.target.closest('.rediger')) {
      const ny = spor('Nettadresse eller filsti på maskinen:', u || '');
      if (ny != null) sett(ny.trim());
    } else if (u.startsWith('http')) {
      window.open(u, '_blank');
    } else {
      status('Åpner lokal fil (i ekte: via serveren) — ' + u);
    }
  });
  return d;
}

/* ── Kilde-chip: dra fra dokken → lenkekort der du slipper ── */
const chip = document.getElementById('kilde-chip');
const spok = document.getElementById('kilde-spokelse');
chip.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  chip.setPointerCapture(e.pointerId);
  spok.style.display = 'inline-flex';
  const flytt = (ev) => {
    spok.style.left = (ev.clientX + 10) + 'px';
    spok.style.top = (ev.clientY + 6) + 'px';
  };
  flytt(e);
  chip.addEventListener('pointermove', flytt);
  chip.addEventListener('pointerup', function slipp(ev) {
    chip.removeEventListener('pointermove', flytt);
    chip.removeEventListener('pointerup', slipp);
    spok.style.display = 'none';
    if (ev.clientY > 90) {
      const [vx, vy] = tilVerden(ev);
      document.body.classList.add('har-innhold');
      lagLenkekort(vx - 20, vy - 16);
      status('Kilde sluppet — klikk kortet og lim inn adressen');
    }
  });
});

/* ── «Vis eksempelet» (som før, nå i verdens-koordinater) ── */
function visEksempel() {
  document.body.classList.add('har-innhold');
  const b = innerWidth, h = innerHeight;
  const cx = (b * .42 - kam.tx) / kam.s, cy = (h * .5 - kam.ty) / kam.s;

  lagNodeSti(vinglSirkel(cx, cy, b * .21, h * .34),
             cx - b * .21, cy - h * .34, b * .42, h * .68);
  noder.at(-1).anker = TEMAER[1];   // eksempelet er alt forankret til 02

  strek(cx + b * .19, cy - h * .1, cx + b * .26, cy - h * .16);

    'Forslag: dette rimer med skyggerapport-poenget fra forrige tema — verdt en strek?',

  kort(cx + b * .25, cy + h * .14,
    '«Skygge-IT er ikke et avvik, det er et signal.» — fra bilde av bokside, OCR-et i innboksen.',
    'bok · foto · ufordelt', 'ufordelt');

function tilSlide() {
  status('I ekte: hopper til slide 02 i verkstedet …');
  // demo: verkstedet bor hjemme i Laterna
}

function vinglSirkel(cx, cy, rx, ry) {
  const pkt = [];
  for (let i = 0; i <= 120; i++) {
    const t = (i / 120) * Math.PI * 2;
    const v = t - Math.PI / 2;
    const w = 1 + Math.sin(t * 3.1) * .022 + Math.cos(t * 1.7) * .018;
    pkt.push([cx + Math.cos(v) * rx * w, cy + Math.sin(v) * ry * w]);
  }
  return stiD(pkt) + ' Z';
}
function vinglRekt(x, y, b, h) {
  /* håndtegnet-aktig avrundet rektangel: rette kanter med bitteliten vingling */
  const r = 18, pkt = [];
  const kant = (x1, y1, x2, y2, n) => {
    for (let i = 0; i <= n; i++) {
      const t = i / n;
      pkt.push([x1 + (x2 - x1) * t + Math.sin(t * 9 + x1) * 1.2,
                y1 + (y2 - y1) * t + Math.cos(t * 7 + y1) * 1.2]);
    }
  };
  kant(x + r, y, x + b - r, y, 14);
  kant(x + b, y + r, x + b, y + h - r, 10);
  kant(x + b - r, y + h, x + r, y + h, 14);
  kant(x, y + h - r, x, y + r, 10);
  return stiD(pkt) + ' Z';
}
function strek(x1, y1, x2, y2) {
  const p = document.createElementNS(NS, 'path');
  p.setAttribute('class', 'strok claude');
  const mx = (x1 + x2) / 2, my = (y1 + y2) / 2 - 18;
  p.setAttribute('d', `M ${x1} ${y1} Q ${mx} ${my} ${x2} ${y2}`);
  svg.appendChild(p);
  stroker.push({ el: p, pkt: [[x1, y1], [mx, my], [x2, y2]] });
}
function kort(x, y, tekst, kilde, ekstra) {
  const d = document.createElement('div');
  d.className = 'flytende';
  d.style.left = x + 'px'; d.style.top = y + 'px';
  d.innerHTML = `<div class="kort ${ekstra || ''}">${tekst}<span class="kilde">${kilde}</span></div>`;
  kamera.appendChild(d);
  gjorSkalerbar(d.firstChild);
  gjorDrabar(d);
}

/* drag-n-drop: alle flytende elementer kan dras fritt — en liten terskel
   skiller dra fra klikk, så lenkekort fortsatt kan åpnes */
function gjorDrabar(d) {
  d.style.touchAction = 'none';
  d.addEventListener('pointerdown', (e) => {
    if (e.target.closest('.grip, .rediger')) return;
    d.setPointerCapture(e.pointerId);
    const start = { x: e.clientX, y: e.clientY,
                    l: parseFloat(d.style.left), t: parseFloat(d.style.top) };
    let dro = false;
    const flytt = (ev) => {
      if (!dro && Math.hypot(ev.clientX - start.x, ev.clientY - start.y) > 5) dro = true;
      if (dro) {
        d.style.left = start.l + (ev.clientX - start.x) / kam.s + 'px';
        d.style.top  = start.t + (ev.clientY - start.y) / kam.s + 'px';
      }
    };
    d.addEventListener('pointermove', flytt);
    d.addEventListener('pointerup', () => {
      d.removeEventListener('pointermove', flytt);
      if (dro) {
        const stopp = (ev) => { ev.stopPropagation();
                               d.removeEventListener('click', stopp, true); };
        d.addEventListener('click', stopp, true);
        setTimeout(() => d.removeEventListener('click', stopp, true), 0);
      }
    }, { once: true });
  });
}

/* størrelses-grip: dra hjørnet → bredden endres i verdens-koordinater */
function gjorSkalerbar(kortEl) {
  const g = document.createElement('span');
  g.className = 'grip';
  g.innerHTML = '<svg viewBox="0 0 14 14"><path stroke="currentColor" ' +
    'stroke-width="1.4" stroke-linecap="round" fill="none" ' +
    'd="M4 12 L12 4 M8.5 12 L12 8.5"/></svg>';
  kortEl.appendChild(g);
  g.addEventListener('pointerdown', (e) => {
    e.stopPropagation(); e.preventDefault();
    g.setPointerCapture(e.pointerId);
    /* helt dynamisk: gripen skalerer HELE kortet — tekst, ikoner, alt —
       proporsjonalt, i stedet for å bare endre bredden */
    const start = { x: e.clientX, s: parseFloat(kortEl.dataset.skala || '1'),
                    b: kortEl.offsetWidth };
    kortEl.style.transformOrigin = 'top left';
    const flytt = (ev) => {
      const ny = Math.max(.35, Math.min(3,
        start.s * (1 + (ev.clientX - start.x) / kam.s / (start.b * start.s))));
      kortEl.dataset.skala = ny;
      kortEl.style.transform = `scale(${ny})`;
    };
    g.addEventListener('pointermove', flytt);
    g.addEventListener('pointerup', () =>
      g.removeEventListener('pointermove', flytt), { once: true });
  });
}
